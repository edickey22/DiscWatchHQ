kind = "web"
previewPath = "/"
title = "DiscWatchHQ"
version = "1.0.0"
id = "artifacts/tracker"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20338

[services.development]
run = "pnpm --filter @workspace/tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tracker", "run", "build" ]
serve = "static"
publicDir = "artifacts/tracker/dist/public"

# Routing strategy: no blanket catch-all — the static server serves
# directory-level index.html files written by generate-og-pages.mjs.
#
# How each route is served in production:
#   Static assets (/assets/*, /og-image.png, /consoles/*.jpg, etc.)
#     → exact file match (no rewrite needed)
#   Pre-generated SPA routes: /, /about, /boutique, /games, /consoles,
#     /consoles/:id, /privacy, /terms, /tracking, /profile, /releases/:id
#     → served from their dist/public/{route}/index.html (per-route og tags)
#   /games/* (CatalogListPage sub-routes: /popular, /new-releases, /upcoming)
#     → rewritten to /games/index.html
#   /releases/:id — pre-generated by generate-og-pages.mjs with noindex.
#     NO rewrite rule here: the static server serves releases/{id}/index.html
#     directly, which carries <meta name="robots" content="noindex, follow">.
#     A blanket /releases/* rewrite intercepts ALL requests (even those with
#     a pre-generated shell) and returns the root index.html instead, defeating
#     the noindex. Without this rewrite, the static server finds the shell first.
#     New releases added after the last build get a 404 until the next publish
#     — acceptable vs. permanently serving "index, follow".

[[services.production.rewrites]]
from = "/games/*"
to = "/games/index.html"

[services.env]
PORT = "20338"
BASE_PATH = "/"
